[project]
name = "university-architect-agents"
version = "0.1.0"
description = "LangGraph multi-agent service for University Architect."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "langgraph>=0.2.28",
    "langchain-anthropic>=0.2.3",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/university_architect"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
